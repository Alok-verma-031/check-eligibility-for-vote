<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Check For Vote</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <h1 style="color:orange;text-shadow:5px 5px 4px black;text-align:center;">Check Eligibility for Vote</h1>
    <form class="form-group" method="post" th:object="${dto}">
    	<table class="table table-bordered" style="margin:50px auto;width:50%">
    	<tr>
    			<td>Enter Your Name</td>
    			<td>
       				<input placeholder="Alok Verma" type="text" th:field="${dto.name}" class="form-control" required/>
    			</td>
    		</tr>
    		<tr>
    			<td>Enter Your Birth Year</td>
    			<td>
       				<input placeholder="YYYY" type="number" th:field="${dto.dobYear}" class="form-control" required/>
    			</td>
    		</tr>
    		<tr>
    			<td>Male</td>
    			<td >
    				<input type="radio" th:field="${dto.gender}"  value="Male" class="form-check-input"/>  Male
    				<input type="radio" th:field="${dto.gender}" value="Female" class="form-check-input"/>  Female
    			</td>
    		</tr>
    		<tr>
    			<td>
    				<button type="submit" class="btn btn-primary">Check</button>
    			</td>
    			<td>
    			<div th:if="${msg}">
    			<p th:utext="${msg}"></p>
    			</div>
    			</td>
    		</tr>
    		
    	</table>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
